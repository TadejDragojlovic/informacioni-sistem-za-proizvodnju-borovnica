name: Automatsko testiranje Laravel aplikacije

on: 
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
    
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4


      - name: Podesavanje PHP-a 
        uses: shivammathur/setup-php@v2
        with: 
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo, json, sqlite3, curl
          coverage: none


      - name: Composer zavisnosti
        uses: actions/cache@v4
        with: 
              path: vendor
              key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
              restore-keys: |
               ${{ runner.os }}-composer-

      - name: Instalacija composer paketa
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Instalacija Nodejs zavisnosti
        run: npm install

      - name: Build vite
        run: npm run build

      - name: Kopiranje .env.example u .env fajl
        run: cp .env.example .env

      - name: Generisanje aplikacijskog kljuca
        run: php artisan key:generate

      - name: Create Database
        run: |
          touch database/database.sqlite

      # migracije
      - name: Execute Migrations
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force
      
      - name: Upotreba PINT za pravilnu stilizaciju koda
        run: ./vendor/bin/pint --test

      - name: Pokretanje testova
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test --exclude-group=mysql-concurrency

  mysql-concurrency:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: borovnice_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: borovnice_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Podesavanje PHP-a
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_mysql, pcntl
          coverage: none

      - name: Instalacija composer paketa
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Priprema Laravel okruzenja
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate:fresh --force

      - name: Konkurentna FIFO rezervacija na MySQL-u
        run: php artisan test --group=mysql-concurrency

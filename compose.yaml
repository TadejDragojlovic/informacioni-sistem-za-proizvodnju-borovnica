services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: borovnice-app
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - borovnice_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: borovnice-mysql
    environment:
      MYSQL_DATABASE: borovnice
      MYSQL_USER: borovnice
      MYSQL_PASSWORD: borovnice
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - borovnice_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -proot --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  node:
    image: node:22
    container_name: borovnice-node
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - borovnice_node_modules:/var/www/html/node_modules
    command: >
      sh -c "
      npm install &&
      npm run dev -- --host 0.0.0.0
      "
    restart: unless-stopped

volumes:
  borovnice_mysql_data:
  borovnice_vendor:
  borovnice_node_modules:
